[project]
name = "speed-constraint-gb"
version = "0.1.0"
description = "Binding the Limit: the casualty and travel-time trade-off of vehicle speed constraints in Great Britain"
requires-python = ">=3.12"
# Dependencies are added phase by phase, when the phase that needs them starts.
dependencies = [
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "duckdb>=1.5.6",
    "dbt-postgres>=1.11.0",
    "pandas>=3.0.6",
    "odfpy>=1.4.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]