version: 2

models:
  - name: stg_traffic_road_class
    description: DfT traffic (TRA0202) in long form, one row per year and road category, using the same category names as int_collision_enriched.
    columns:
      - name: year
        data_tests: [not_null]
      - name: traffic_road_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['Motorway', 'Urban A road', 'Urban minor road', 'Rural A road', 'Rural minor road']
      - name: billion_vehicle_km
        data_tests: [not_null]
  - name: stg_speed_bands_cars
    description: Free-flow car speed bands from SPE0102, one row per year, road type and 5 mph band.
    columns:
      - name: speed_limit_mph
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [20, 30, 60, 70]
                quote: false
      - name: band_lower_mph
        data_tests: [not_null]
  - name: stg_speed_bands_vans
    description: Free-flow van speed bands from SPE0102, one row per year, road type and 5 mph band, where DfT publishes them (not on national-limit single carriageways).
    columns:
      - name: speed_limit_mph
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [20, 30, 70]
                quote: false
      - name: band_lower_mph
        data_tests: [not_null]
  - name: stg_speed_summary_vans
    description: DfT's summary figures for vans from SPE0102, one row per year and road type.
    columns:
      - name: avg_free_flow_mph
        data_tests: [not_null]
  - name: stg_traffic_vehicle_road_class
    description: DfT traffic by vehicle type (TRA0204), one row per year, road category and vehicle type. A roads' trunk and principal rows are added together; DfT's total rows are dropped.
    columns:
      - name: year
        data_tests: [not_null]
      - name: traffic_road_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Motorway', 'Urban A road', 'Urban minor road', 'Rural A road', 'Rural minor road']
      - name: vehicle_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Cars and Taxis', 'Light Commercial Vehicles', 'Heavy Goods Vehicles', 'Motorcycles', 'Buses and Coaches']
      - name: billion_vehicle_km
        data_tests: [not_null]
