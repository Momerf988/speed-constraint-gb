version: 2

seeds:
  - name: dft_published_totals
    description: >
      Headline totals from DfT's own publications. The test
      assert_matches_dft_published_totals checks the marts reproduce them.
      Adjusted KSI is only checked for the latest year: DfT re-estimates the severity
      adjustment every year, so older published KSI figures get revised.
    config:
      column_types:
        year: smallint
        measure: text
        published_value: numeric
        tolerance: numeric
        source: text

  - name: dft_published_road_type_counts
    description: >
      DfT's published 2025 counts by road type and class (table RAS0302). The test
      assert_matches_dft_road_type_counts checks the road categories reproduce them.
    config:
      column_types:
        year: smallint
        traffic_road_category: text
        measure: text
        published_value: numeric
        tolerance: numeric
        source: text